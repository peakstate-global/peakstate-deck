<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Balance test deck · peakstate-deck fixtures</title>
<link rel="stylesheet" href="deck.css">
<style>
  section { display: flex; flex-direction: column; padding: 80px 120px 0; box-sizing: border-box; }
  .stage { flex: 1; display: flex; flex-direction: column; }
  .ft { position: absolute; left: 120px; right: 120px; bottom: 50px; }
  .box { height: 200px; background: #ccc; }
</style>
</head>
<body>
<!-- One slide hugging its heading, one centred, one hugging but opted out. -->
<deck-stage design-width="1920" design-height="1080">
  <section data-screen-label="Hug"><h2>Heading</h2><div class="stage"><div class="box"></div></div><div class="ft"><span>1</span></div></section>
  <section data-screen-label="Centred"><h2>Heading</h2><div class="stage" style="justify-content:center"><div class="box"></div></div><div class="ft"><span>2</span></div></section>
  <section data-screen-label="OptOut" data-balance="off"><h2>Heading</h2><div class="stage"><div class="box"></div></div><div class="ft"><span>3</span></div></section>
</deck-stage>
<script src="deck-stage.js"></script>
<script src="deck-tools.js"></script>
</body>
</html>
